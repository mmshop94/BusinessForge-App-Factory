[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "businessforge-app-factory"
version = "0.1.0"
description = "White-label build factory for BusinessForge Customer App"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "BusinessForge" }]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.23",
    "PyYAML>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
app-factory = "app_factory.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
